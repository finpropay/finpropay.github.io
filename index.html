<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E8812F">
<title>FinProPay</title>
<!--
  TikTok linki üçün keçid səhifəsi.
  Hər açılışda GA4-ə "tiktok_click" hadisəsi göndərir (os = android / ios / other, link_source = ?s=),
  sonra Android-də Play Market tətbiqini birbaşa açmağa çalışır (intent://), alınmasa düymə göstərir.
  iPhone-da tətbiq olmadığı üçün yönləndirmə yoxdur, izah göstərilir.
  GA4 property: "FinProPay TikTok" (web axını "TikTok link").
  ?preview=android / ?preview=ios — yalnız dizayna baxmaq üçün: analitika və yönləndirmə işləmir.
-->
<script>
  var GA_ID = "G-PDC1E42HW6";
  var PACKAGE = "com.comfortableservice.finpropay";

  var params = new URLSearchParams(location.search);
  var preview = params.get("preview");
  var ua = navigator.userAgent || "";
  var os = (preview === "tiktok" ? "android" : preview) || (/android/i.test(ua) ? "android"
    : (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) ? "ios"
    : "other");
  // TikTok-un daxili brauzeri (Android WebView) Play Market-i çox vaxt açmır — ?preview=tiktok ilə baxmaq olar
  var inApp = preview === "tiktok" || (os === "android" && /; wv\)|musical_ly|bytedance|trill/i.test(ua));
  // ?s=v1 / v2 / promote ... — həm Analytics-də, həm Play Console-da (utm_medium) mənbə kimi görünür
  var source = (params.get("s") || "bio").replace(/[^a-z0-9_-]/gi, "").slice(0, 30) || "bio";
  var REFERRER = encodeURIComponent("utm_source=tiktok&utm_medium=" + source);
  var PLAY_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE + "&referrer=" + REFERRER;
  // Play Market tətbiqini birbaşa açır; TikTok brauzeri adi https linkini bəzən açmır
  var INTENT_URL = "intent://details?id=" + PACKAGE + "&referrer=" + REFERRER
    + "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url="
    + encodeURIComponent(PLAY_URL) + ";end";

  var done = false;
  function go() {
    if (done || preview || os === "ios") return;
    done = true;
    location.href = os === "android" ? INTENT_URL : PLAY_URL;
  }

  if (!preview) {
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", GA_ID, { send_page_view: false });
    gtag("event", "tiktok_click", { os: os, link_source: source, event_callback: go });

    var tag = document.createElement("script");
    tag.async = true;
    tag.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
    document.head.appendChild(tag);

    // Analitika yüklənməsə belə istifadəçi gözləməsin.
    setTimeout(go, 1200);
  }

  // Mətnlər həmişə Azərbaycan dilində
  var T = {
    open: "Google Play-də aç",
    opening: "Google Play açılır…",
    fallback: "Açılmasa düyməyə toxun",
    inAppHint: "Play açılmırsa: yuxarıda <b>⋯</b> düyməsinə toxun → <b>Chrome-da aç</b>",
    iosTitle: "Hələlik yalnız Android-də",
    iosText: "FinProPay-in iPhone versiyası hələ yoxdur. Android telefonun varsa, bu linki orada aç.",
    copy: "Linki kopyala",
    copied: "Kopyalandı ✓"
  };
</script>
<style>
  :root {
    --brand: #E8812F;
    --brand-dark: #C9671A;
    --bg: #FFF7F0;
    --card: #FFFFFF;
    --text: #1F1A17;
    --muted: #6B625C;
    --line: #F0E2D6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120F;
      --card: #221B17;
      --text: #F7EFE9;
      --muted: #B5A89F;
      --line: #3A2F28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
    border-radius: 24px; padding: 32px 24px 28px; text-align: center;
    box-shadow: 0 12px 32px rgba(232, 129, 47, 0.12);
  }
  .icon { width: 88px; height: 88px; border-radius: 22px; display: block; margin: 0 auto 16px; }
  h1 { font-size: 24px; margin: 0 0 24px; letter-spacing: -0.01em; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    min-height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff;
    font: 600 17px/1.2 inherit; text-decoration: none; cursor: pointer;
  }
  .btn:active { background: var(--brand-dark); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn.secondary { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
  .status { display: flex; align-items: center; justify-content: center; gap: 8px;
            margin: 16px 0 0; color: var(--muted); font-size: 14px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line);
             border-top-color: var(--brand); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ios-badge { display: inline-block; margin: 0 0 12px; padding: 6px 12px; border-radius: 999px;
               background: var(--bg); color: var(--brand-dark); font-size: 13px; font-weight: 600; }
  .ios-text { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .inapp-hint { margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45;
                background: rgba(232, 129, 47, 0.14); color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="https://play-lh.googleusercontent.com/ZRRZIwnT2Owx-pGNrohvPqzkGIpRMyKlBFv2Xbr-vzfr8BMam7_oWEcpdrTYXxfGhJ6UHqNQ6qDeaDluu4ap=w176-h176-rw" alt="FinProPay">
    <h1>FinProPay</h1>

    <section id="android" hidden>
      <a class="btn" id="open-btn" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.6 2.3c-.3.3-.4.7-.4 1.2v17c0 .5.1.9.4 1.2l9.3-9.7-9.3-9.7zm10.4 8.6 2.6-2.7L5.9 1.6c-.3-.2-.6-.2-.9-.2l10 9.5zm0 2.2-10 9.5c.3 0 .6 0 .9-.2l11.7-6.6-2.6-2.7zm4.6-3.8-2.9-1.7-2.9 3 2.9 3 2.9-1.7c.8-.5.8-2.1 0-2.6z"/></svg>
        <span id="open-label"></span>
      </a>
      <p class="status" id="status"><span class="spinner"></span><span id="status-text"></span></p>
      <p class="inapp-hint" id="inapp-hint" hidden></p>
    </section>

    <section id="ios" hidden>
      <span class="ios-badge" id="ios-title"></span>
      <p class="ios-text" id="ios-text"></p>
      <button class="btn secondary" id="copy-btn" type="button"></button>
    </section>
  </main>
<script>
  if (os === "ios") {
    document.getElementById("ios").hidden = false;
    document.getElementById("ios-title").textContent = T.iosTitle;
    document.getElementById("ios-text").textContent = T.iosText;
    var copyBtn = document.getElementById("copy-btn");
    copyBtn.textContent = T.copy;
    copyBtn.onclick = function () {
      var link = location.origin + location.pathname + "?s=" + source;
      try {
        navigator.clipboard.writeText(link).then(function () { copyBtn.textContent = T.copied; });
      } catch (e) { prompt("", link); }
    };
  } else {
    document.getElementById("android").hidden = false;
    var btn = document.getElementById("open-btn");
    btn.href = os === "android" ? INTENT_URL : PLAY_URL;
    document.getElementById("open-label").textContent = T.open;
    document.getElementById("status-text").textContent = T.opening;
    // Avtomatik keçid alınmayıbsa, 2.5 saniyədən sonra düyməyə yönləndirən mətn
    setTimeout(function () {
      var s = document.getElementById("status");
      s.innerHTML = "";
      s.textContent = T.fallback;
      if (inApp) {
        var h = document.getElementById("inapp-hint");
        h.innerHTML = T.inAppHint;
        h.hidden = false;
      }
    }, 2500);
  }
</script>
</body>
</html>
